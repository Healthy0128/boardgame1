<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#15191f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BOARD TABLE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="extra-games.css">
<link rel="stylesheet" href="mancala-fix.css">
<link rel="stylesheet" href="howto.css">
<link rel="stylesheet" href="face-to-face.css">
<link rel="stylesheet" href="glass-visuals.css">
<link rel="stylesheet" href="direction-fix.css">
<link rel="stylesheet" href="sugoroku-effects.css">
<title>BOARD TABLE</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button id="homeBtn" class="icon-btn hidden" aria-label="ホームへ">⌂</button>
    <div class="brand"><span class="brand-dot"></span><span>BOARD TABLE</span></div>
    <button id="soundBtn" class="icon-btn" aria-label="サウンド切替">♪</button>
  </header>
  <main>
    <section id="home" class="screen active home-screen">
      <div class="hero"><div class="eyebrow">PASS & PLAY</div><h1>1台で、すぐ対戦。</h1><p>スマホ・タブレット・PC対応。実物の盤・石・駒の手触りを感じる、1台対戦ボードゲームコレクション。</p></div>
      <div class="game-grid">
        <button class="game-card reversi-card" data-game="reversi"><div class="card-art reversi-art"><span class="disc black"></span><span class="disc white"></span></div><div class="card-copy"><small>CLASSIC</small><h2>リバーシ</h2><p>はさんで、返して、盤面を取る。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card shogi-card" data-game="shogi"><div class="card-art shogi-art"><span>王</span><span>飛</span><span>歩</span></div><div class="card-copy"><small>CLASSIC</small><h2>将棋</h2><p>取った駒も使える、日本の戦略ゲーム。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card chess-card" data-game="chess"><div class="card-art chess-art"><img src="assets/chess/white_king.svg" alt=""><img src="assets/chess/black_queen.svg" alt=""></div><div class="card-copy"><small>CLASSIC</small><h2>チェス</h2><p>世界中で遊ばれる王道ストラテジー。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card" data-extra-game="mancala"><div class="card-art extra-art mancala-art">🟤 🟠 🟡</div><div class="card-copy"><small>TACTICAL</small><h2>マンカラ</h2><p>木の盤に石を一粒ずつ配る。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card" data-extra-game="gomoku"><div class="card-art extra-art gomoku-art">● ○ ●</div><div class="card-copy"><small>QUICK</small><h2>五目並べ</h2><p>碁石を置き、5つ一直線に並べる。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card" data-extra-game="connect4"><div class="card-art extra-art connect4-art">🔴 🟡 🔴</div><div class="card-copy"><small>QUICK</small><h2>コネクト4</h2><p>ディスクを落として4つ並べる。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card" data-extra-game="ohajiki"><div class="card-art extra-art ohajiki-art">🔵 🔴 🟢</div><div class="card-copy"><small>ACTION</small><h2>おはじき</h2><p>ガラスのおはじきを引いて弾く。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card" data-extra-game="hasami"><div class="card-art extra-art hasami-art">☗ ☖ ☗</div><div class="card-copy"><small>TACTICAL</small><h2>はさみ将棋</h2><p>木盤の上で相手の駒を挟んで取る。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card" data-extra-game="checkers"><div class="card-art extra-art checkers-art">🔴 ⚫ 🔴</div><div class="card-copy"><small>CLASSIC</small><h2>チェッカー</h2><p>厚みのある駒で飛び越えて捕獲。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card" data-extra-game="dots"><div class="card-art extra-art dots-art">• ─ •<br>│　│<br>• ─ •</div><div class="card-copy"><small>QUICK</small><h2>Dots & Boxes</h2><p>紙の盤に線を引き、四角を獲得。</p></div><span class="play-chip">PLAY</span></button>
        <button class="game-card" data-extra-game="sugoroku"><div class="card-art extra-art sugoroku-art">🎲 🏁</div><div class="card-copy"><small>FAMILY</small><h2>双六</h2><p>サイコロを振って先にゴールへ。</p></div><span class="play-chip">PLAY</span></button>
      </div>
      <div class="home-note">軽い2Dのまま、盤・駒・石の質感を実物寄りに仕上げています</div>
    </section>
    <section id="gameScreen" class="screen game-screen"><div class="game-shell"><div class="game-head"><div><div id="gameKicker" class="eyebrow"></div><h2 id="gameTitle"></h2></div><div id="turnBadge" class="turn-badge"></div></div><div id="status" class="status"></div><div id="capturedTop" class="captured captured-top"></div><div id="boardWrap" class="board-wrap"><div id="board" class="board"></div></div><div id="capturedBottom" class="captured captured-bottom"></div><div id="score" class="scorebar"></div><div class="controls"><button id="undoBtn">↶ 待った</button><button id="rotateBtn">⟳ 盤を回す</button><button id="restartBtn" class="danger">最初から</button></div></div></section>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><div id="modalIcon" class="modal-icon">♛</div><h3 id="modalTitle"></h3><p id="modalText"></p><div id="modalActions" class="modal-actions"></div></div></div>
  <div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
<script src="extra-games.js"></script>
<script src="rich-board.js"></script>
<script src="howto.js"></script>
<script src="face-to-face.js"></script>
<script src="glass-visuals.js"></script>
<script src="direction-fix.js"></script>
<script src="sugoroku-core-fix.js"></script>
<script src="sugoroku-effects.js"></script>
</body>
</html>
