name: Install per-game BGM and SFX
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-game-music.sh'
      - '.github/workflows/install-game-music.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 music and wire game audio
        run: bash scripts/install-game-music.sh
      - name: Commit generated local audio assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.js sw.js assets/audio
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bundle per-game BGM and physical SFX'
          git push
