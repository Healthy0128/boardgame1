name: Install authentic board sounds
on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-authentic-sounds.sh'
      - '.github/workflows/install-authentic-sounds.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install selected CC0 sounds and wire shogi audio
        run: bash scripts/install-authentic-sounds.sh
      - name: Commit generated local assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.js sw.js assets/audio
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bundle authentic board game sounds'
          git push
