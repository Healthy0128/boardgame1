name: Check 2D games
on:
  pull_request:
    paths:
      - 'extra-games.js'
      - 'extra-games.css'
      - 'index.html'
      - 'sw.js'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check extra-games.js
      - name: Verify home entries
        run: |
          for game in mancala ohajiki gomoku connect4 sugoroku hasami checkers dots; do
            grep -q "data-extra-game=\"$game\"" index.html
          done
