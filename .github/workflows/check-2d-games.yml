name: Check 2D games
on:
  pull_request:
    paths:
      - 'extra-games.js'
      - 'extra-games.css'
      - 'ohajiki-square.css'
      - 'mancala-kalah-fix.js'
      - 'rich-board.js'
      - 'howto.js'
      - 'howto.css'
      - 'face-to-face.js'
      - 'face-to-face.css'
      - 'glass-visuals.js'
      - 'glass-visuals.css'
      - 'direction-fix.js'
      - 'direction-fix.css'
      - 'shogi-face-fix.css'
      - 'shogi-single-source.js'
      - 'ohajiki-elimination-fix.js'
      - 'sugoroku-core-fix.js'
      - 'sugoroku-effects.js'
      - 'sugoroku-effects.css'
      - 'index.html'
      - 'sw.js'
      - 'scripts/install-rich-board-assets.sh'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and installer syntax
        run: |
          node --check app.js
          node --check extra-games.js
          node --check mancala-kalah-fix.js
          node --check rich-board.js
          node --check howto.js
          node --check face-to-face.js
          node --check glass-visuals.js
          node --check direction-fix.js
          node --check shogi-single-source.js
          node --check ohajiki-elimination-fix.js
          node --check sugoroku-core-fix.js
          node --check sugoroku-effects.js
          bash -n scripts/install-rich-board-assets.sh
      - name: Verify home entries and rich asset hooks
        run: |
          for game in mancala ohajiki gomoku connect4 sugoroku hasami checkers dots; do
            grep -q "data-extra-game=\"$game\"" index.html
          done
          grep -q 'mancala-kalah-fix.js' index.html
          grep -q 'function pitToRing(i){return i<6?i:i+1}' mancala-kalah-fix.js
          grep -q 'function ownStore(p){return p===0?6:13}' mancala-kalah-fix.js
          grep -q 'if(ring===oppStore(p))continue' mancala-kalah-fix.js
          grep -q 'const opposite=11-lastPit' mancala-kalah-fix.js
          grep -q 'lastRing!==ownStore(p)' mancala-kalah-fix.js
          grep -q 'sugoroku-core-fix.js' index.html
          grep -q 'performance.now()-started<2000' sugoroku-core-fix.js
          grep -q 'async function stepTo' sugoroku-core-fix.js
          grep -q 'session.pos\[player\]' sugoroku-core-fix.js
          grep -q 'shogi-single-source.js' index.html
          grep -q "replace('/white_','/black_')" shogi-single-source.js
          grep -q "owner==='w'?180:0" shogi-single-source.js
          grep -q "owner==='w'?0:180" shogi-single-source.js
          ! grep -q 'shogi-piece-angle.js' index.html
          ! grep -q "if(t==='将棋')" direction-fix.js
          ! grep -q 'getBoundingClientRect' direction-fix.js
          ! grep -q 'function syncShogi' face-to-face.js
          grep -q 'ohajiki-elimination-fix.js' index.html
          grep -q 'ohajiki-square.css' index.html
          grep -q 'const SIZE=560' ohajiki-elimination-fix.js
          grep -q 'const START_X=140' ohajiki-elimination-fix.js
          grep -q 'setPointerCapture' ohajiki-elimination-fix.js
          grep -q 'q.x>=0&&q.x<=SIZE&&q.y>=0&&q.y<=SIZE' ohajiki-elimination-fix.js
          grep -q 'aspect-ratio:1/1' ohajiki-square.css
          grep -q 'margin:0 auto' ohajiki-square.css
          grep -q 'P1 残り' ohajiki-elimination-fix.js
          grep -q 'remaining(1)' ohajiki-elimination-fix.js
          grep -q 'remaining(2)' ohajiki-elimination-fix.js
          grep -q 'mancala-pebble.p1' glass-visuals.css
          grep -q 'ohajiki-canvas' glass-visuals.js
          grep -q 'assets/board/wood.png' extra-games.css
          grep -q 'assets/board/go_black.png' extra-games.css
          for game in reversi shogi chess mancala gomoku connect4 ohajiki hasami checkers dots sugoroku; do
            grep -q "$game:{title:" howto.js
          done