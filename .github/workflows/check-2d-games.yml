name: Check 2D games
on:
  pull_request:
    paths:
      - 'extra-games.js'
      - 'extra-games.css'
      - 'rich-board.js'
      - 'howto.js'
      - 'howto.css'
      - 'face-to-face.js'
      - 'face-to-face.css'
      - 'glass-visuals.js'
      - 'glass-visuals.css'
      - 'direction-fix.js'
      - 'direction-fix.css'
      - 'shogi-face-fix.css'
      - 'shogi-piece-angle.js'
      - 'sugoroku-core-fix.js'
      - 'sugoroku-effects.js'
      - 'sugoroku-effects.css'
      - 'index.html'
      - 'sw.js'
      - 'scripts/install-rich-board-assets.sh'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and installer syntax
        run: |
          node --check app.js
          node --check extra-games.js
          node --check rich-board.js
          node --check howto.js
          node --check face-to-face.js
          node --check glass-visuals.js
          node --check direction-fix.js
          node --check shogi-piece-angle.js
          node --check sugoroku-core-fix.js
          node --check sugoroku-effects.js
          bash -n scripts/install-rich-board-assets.sh
      - name: Verify home entries and rich asset hooks
        run: |
          for game in mancala ohajiki gomoku connect4 sugoroku hasami checkers dots; do
            grep -q "data-extra-game=\"$game\"" index.html
          done
          grep -q 'sugoroku-core-fix.js' index.html
          grep -q 'performance.now()-started<2000' sugoroku-core-fix.js
          grep -q 'async function stepTo' sugoroku-core-fix.js
          grep -q 'session.pos\[player\]' sugoroku-core-fix.js
          grep -q 'shogi-piece-angle.js' index.html
          grep -q 'dataset.pieceAngle' shogi-piece-angle.js
          grep -q "topPiece?180:0" shogi-piece-angle.js
          grep -q "topPiece?0:180" shogi-piece-angle.js
          ! grep -q "if(t==='将棋')" direction-fix.js
          ! grep -q 'getBoundingClientRect' direction-fix.js
          ! grep -q 'function syncShogi' face-to-face.js
          grep -q 'mancala-pebble.p1' glass-visuals.css
          grep -q 'ohajiki-canvas' glass-visuals.js
          grep -q 'assets/board/wood.png' extra-games.css
          grep -q 'assets/board/go_black.png' extra-games.css
          for game in reversi shogi chess mancala gomoku connect4 ohajiki hasami checkers dots sugoroku; do
            grep -q "$game:{title:" howto.js
          done
