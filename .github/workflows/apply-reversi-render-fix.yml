name: Apply Reversi incremental render fix

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/patch-reversi-render.py'
      - '.github/workflows/apply-reversi-render-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch app.js
        run: python scripts/patch-reversi-render.py
      - name: Commit patched app.js
        run: |
          if git diff --quiet -- app.js; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app.js
          git commit -m 'Fix Reversi incremental stone rendering'
          git push
